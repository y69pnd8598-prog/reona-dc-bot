name: Run Reona DC Bot Relay

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reona Bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_MODEL_ID: ${{ secrets.FISH_MODEL_ID }}
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          timeout -s INT 330m python reona_dc_bot.py || true

      - name: Commit updated memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f web_reona_memory.json ]; then
            git add web_reona_memory.json
            git diff --staged --quiet || git commit -m "chore: sync Reona memory state"
            git push || true
          fi

      - name: Trigger next relay run (skip during Sydney sleep hours)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYDNEY_HOUR=$(TZ="Australia/Sydney" date +%H)
          echo "Current Sydney hour: $SYDNEY_HOUR"
          if [ "$SYDNEY_HOUR" -ge 1 ] && [ "$SYDNEY_HOUR" -lt 7 ]; then
            echo "Sydney sleep hours (01:00-06:59), skipping immediate relay."
            exit 0
          fi
          gh workflow run "Run Reona DC Bot Relay" --repo "${{ github.repository }}" || true
