name: Run Reona Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"   # 每天雪梨時間 08:00 自動喚醒上線傳早安

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -U discord.py groq

      - name: Run Reona Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python reona_dc_bot.py

      - name: Trigger next relay run (skip during Sydney sleep hours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYD_HM=$(TZ="Australia/Sydney" date +"%H%M")
          echo "Current Sydney HHMM: $SYD_HM"
          if [ "$SYD_HM" -ge 0130 ] && [ "$SYD_HM" -lt 0750 ]; then
            echo "Sleep hours (01:30 - 07:50 Sydney), skipping relay until 08:00 schedule."
            exit 0
          fi
          gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
