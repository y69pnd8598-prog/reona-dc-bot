name: Reona Discord Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reona-discord-bot
  cancel-in-progress: false

jobs:
  run-reona:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install discord.py aiohttp

      - name: Run Reona bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REONA_DB_PATH: reona_bg.db
          PROACTIVE_ONLY: "1"
        run: python reona_dc_bot.py

      - name: Persist SQLite memory back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f *.db 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update reona state and memory [skip ci]"
            git push
          fi
