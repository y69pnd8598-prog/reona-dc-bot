name: Run Reona Discord Bot

on:
  workflow_dispatch:
  schedule:
    # 每 5 小時 45 分鐘自動接力重啟（避開 GitHub Actions 單次 6 小時上限）
    - cron: '15 */5 * * *'

# 必須加上寫入權限，才能把 reona_memory.json 存回 Repo
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install discord.py requests

      - name: Run Reona Bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_MODEL_ID: ${{ secrets.FISH_MODEL_ID }}
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          python reona_dc_bot.py

      - name: Save memory back to repository
        if: always()
        run: |
          if [ -f "reona_memory.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reona_memory.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update reona_memory.json [skip ci]"
              git pull --rebase origin main || true
              git push
            fi
          fi
