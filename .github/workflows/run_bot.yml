name: Reona Discord Bot

on:
  schedule:
    # 雪梨夏令時間 AEDT (UTC+11)：07:30 起床 (UTC 20:30) ～ 23:30 睡覺 (UTC 12:30)
    # 每 30 分鐘接力啟動一次（每次跑 28 分鐘），白天全程持續在線
    - cron: "30 20 * * *"
    - cron: "0,30 21-23 * * *"
    - cron: "0,30 0-11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reona-discord-bot
  cancel-in-progress: false

jobs:
  run-reona:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install discord.py aiohttp

      - name: Run Reona bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REONA_DB_PATH: reona_bg.db
          PROACTIVE_ONLY: "0"
          RUN_SECONDS: "1680"
        run: python reona_dc_bot.py

      - name: Persist SQLite memory back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f *.db 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update reona state and memory [skip ci]"
            git push
          fi
