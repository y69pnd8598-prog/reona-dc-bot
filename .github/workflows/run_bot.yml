name: Run Reona Bot

on:
  workflow_dispatch:
  schedule:
    # Active only during Sydney waking hours (~08:00–23:59 AEDT/AEST); sleeps 00:00–07:59 Sydney
    - cron: "*/30 21-23,0-13 * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install discord.py groq

      - name: Run Reona Bot (28-min shift)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          REONA_JSON_PATH: reona_memory.json
          REONA_DB_PATH: reona_bg.db
        run: |
          timeout -s SIGINT 1680 python reona_dc_bot.py || true

      - name: Commit and push memory safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reona_memory.json reona_bg.db* || true
          if ! git diff --staged --quiet; then
            git pull --rebase origin HEAD || true
            git commit -m "chore: update Reona memory & state [skip ci]"
            git push
          fi
