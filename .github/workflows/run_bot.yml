name: Reona Discord Companion

on:
  schedule:
    # Runs every 30 mins during Sydney 08:00–23:30 (UTC 21:00–12:30 during AEDT, adjust +1h in AEST)
    - cron: "0,30 21-23 * * *"
    - cron: "0,30 0-12 * * *"
  workflow_dispatch:

concurrency:
  group: reona-bot-singleton
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py groq tzdata

      - name: Run Reona Bot (28-min shift)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
          NICK_USER_ID: ${{ secrets.NICK_USER_ID }}
        run: |
          timeout -s SIGINT 1680 python reona_dc_bot.py || true

      - name: Commit and push memory safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reona_bg.db reona_memory.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(memory): sync Reona state and memories"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 3
            done
          fi
